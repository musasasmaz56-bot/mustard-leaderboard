name: mustard-leaderboard
services:
  - name: web
    type: web
    git:
      repository: musasasmaz56-bot/mustard-leaderboard
      branch: main
    build:
      dockerfile: Dockerfile
    instance_type: nano
    regions:
      - fra # Frankfurt, Europe (low latency to UK)
    ports:
      - port: 8000
        path: /
    routes:
      - path: /
        port: 8000
