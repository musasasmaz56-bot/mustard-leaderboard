name: Keep Leaderboard Awake 24/7

on:
  schedule:
    # Runs every 10 minutes (cron: '*/10 * * * *') to prevent free tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Leaderboard Service
        run: |
          # Replace with your live Render or Koyeb URL if different
          TARGET_URL="${{ secrets.ARENA_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://mustard-arena.onrender.com"
          fi
          
          echo "Pinging 24/7 Arena: $TARGET_URL/ping"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/ping" || true)
          echo "Keep-alive response status: $STATUS_CODE"
          
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "SUCCESS: Leaderboard is active and awake 24/7!"
          else
            echo "Warming up container..."
            curl -s "$TARGET_URL/api/health" || true
          fi
